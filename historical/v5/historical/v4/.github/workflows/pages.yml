name: Verify V4 evidence (optional manual Pages)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Publish only after separate explicit authorization; default is verification only'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: verify-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - name: Install frozen software dependencies
        run: |
          python -m pip install -r requirements-public.txt
          python -m pip install --no-deps -e .
      - name: Bounded public correctness tests
        run: python -m pytest -q
      - name: Validate canonical saved evidence
        run: python scripts/validate_evidence.py --evidence evidence
      - name: Replay existing paid answers without acquisition
        run: python scripts/check_bundled_replays.py --root . --receipt build/replay_check.json
      - name: Regenerate figures from canonical tables
        run: python scripts/make_figures.py --evidence evidence --out build/figures
      - name: Build bilingual site and check local links
        run: python scripts/build_site.py --out _site --figures build/figures
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        with:
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Explicitly requested manual Pages publication
        id: deployment
        uses: actions/deploy-pages@v4
