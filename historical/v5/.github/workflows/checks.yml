name: V5 public finite checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: python -m pip install -r requirements-public.txt
      - run: python -m pytest -q
      - run: python scripts/validate_evidence.py --evidence evidence
      - run: python scripts/check_public_release.py
      - run: python -m scripts.review_v5.public_replay check --bundle replay/synthetic
      - run: python -m scripts.review_v5.public_replay check --bundle replay/dblp_exposed
      - run: python -m scripts.review_v5.public_replay check --bundle replay/dblp_unused
      - run: python scripts/make_figures.py --evidence evidence --out build/figures
      - run: python scripts/build_site.py --out build/site
      - uses: actions/upload-artifact@v4
        with:
          name: v5-local-site
          path: build/site
