name: Verify evidence and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: python -m pip install -r requirements-public.txt
      - run: python -m pytest -q
      - run: python -m scripts.review_v7.validate_evidence --evidence evidence
      - name: Replay preserved V5 answers with the preserved engine
        working-directory: historical/v5
        run: |
          python -m scripts.review_v5.public_replay check --bundle replay/synthetic
          python -m scripts.review_v5.public_replay check --bundle replay/dblp_exposed
          python -m scripts.review_v5.public_replay check --bundle replay/dblp_unused
      - run: python scripts/make_figures_v7_1.py --evidence evidence --legacy historical/v5/evidence --out build/figures_ci
      - run: python scripts/build_site_v7_1.py --root . --out build/site_ci
      - name: Verify release integrity, figure projections and site assets
        run: python scripts/check_release.py --root . --rebuilt-figures build/figures_ci --site build/site_ci
      - name: Upload verified Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site_ci
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
